# Hand-authored semantic port of TailorKey v5.2³ Bilateral (QWERTY).
# Source: https://my.moergo.com/glove80/#/layout/user/10f689fa-608f-4c28-81f9-c29b986d8e06
#
# This is intentionally not the output of an intent-recognizing importer. The
# source JSON was used as a behavioral specification, then its scaffolding was
# replaced by RMK/Rynk runtime features:
# - eight per-finger HRM helper layers become four named profiles using
#   `opposite_hand_hold`, resolved from the firmware's L/R/* geometry tags;
# - 58 duplicated Morse records become named profiles plus typed MT/LT/TH keys;
# - the remaining 12 user-visible layers, 20 combo slots and six true macros
#   retain the source layout's actions.
#
# The file itself is runtime state and is applied through moergo-control. The
# three transparent MouseSlow/MouseFast/MouseWarp layers require these compiled
# input-scale entries to reproduce TailorKey's momentary 1/9x, 3x and 12x mouse
# movement and scrolling exactly; mouse layer scaling is not a runtime command:
#
#   [[behavior.mouse_layer_scale]]
#   layer = 7
#   pointer = [1, 9]
#   scroll = [1, 9]
#   [[behavior.mouse_layer_scale]]
#   layer = 8
#   pointer = [3, 1]
#   scroll = [3, 1]
#   [[behavior.mouse_layer_scale]]
#   layer = 9
#   pointer = [12, 1]
#   scroll = [12, 1]
#
# Without those compiled entries everything else remains usable, but the three
# momentary speed-selector keys on Mouse have no scaling effect.

