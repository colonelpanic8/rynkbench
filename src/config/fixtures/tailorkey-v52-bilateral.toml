[behavior]
combo_timeout_ms = 50
oneshot_timeout_ms = 1000
tap_interval_ms = 20
tap_capslock_interval_ms = 20
oneshot_activate_on_keypress = false
oneshot_quick_release = false

[behavior.morse]
enable_flow_tap = false
prior_idle_ms = 120

[behavior.morse.default_profile]
hold_timeout_ms = 250
gap_timeout_ms = 250
unilateral_tap = false
mode = "normal"

[behavior.morse.profiles.autoshift]
hold_timeout_ms = 190
unilateral_tap = false
mode = "normal"

[behavior.morse.profiles.hrm_index]
enable_flow_tap = true
hold_timeout_ms = 180
quick_tap_ms = 300
prior_idle_ms = 100
opposite_hand_hold = true
mode = "normal"

[behavior.morse.profiles.hrm_middle]
enable_flow_tap = true
hold_timeout_ms = 210
quick_tap_ms = 300
prior_idle_ms = 150
opposite_hand_hold = true
mode = "normal"

[behavior.morse.profiles.hrm_pinky]
enable_flow_tap = true
hold_timeout_ms = 270
quick_tap_ms = 300
prior_idle_ms = 150
opposite_hand_hold = true
mode = "normal"

[behavior.morse.profiles.hrm_ring]
enable_flow_tap = true
hold_timeout_ms = 240
quick_tap_ms = 300
prior_idle_ms = 100
opposite_hand_hold = true
mode = "normal"

[behavior.morse.profiles.thumb_layer]
hold_timeout_ms = 200
quick_tap_ms = 300
unilateral_tap = false
mode = "permissive-hold"
[behavior.morse.profiles.thumb_space_layer]
hold_timeout_ms = 200
quick_tap_ms = 150
unilateral_tap = false
mode = "permissive-hold"
