[package]
name = "rynkbench-desktop"
version = "0.1.0"
description = "Rynkbench desktop shell: the web configurator in a Tauri window with a native hidapi transport"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
hidapi = "2"

[profile.release]
strip = true
